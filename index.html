<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur Multipiste - Raise You Up! (v59)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root { --bg: #0b0f19; --card: #131b2e; --primary: #00d2ff; --text: #f0f4f8; --text-dim: #8a99ad; --accent: #ff4757; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 10px; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow-x: hidden;
    }
    
    #sysContainer {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .sys-card {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .sys-card input {
      background: #0b0f19;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 40px 12px 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      width: 100%;
      text-align: center;
    }
    .toggle-view {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
    }
    .toggle-view:hover { color: var(--primary); }

    .sys-card button.btn-exec {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .sys-card button.btn-exec:hover { opacity: 0.9; }
    #sysAlert { color: var(--accent); font-size: 0.85rem; display: none; }

    #appContent {
      display: none;
      width: 100%;
      max-width: 1050px;
      flex-direction: column;
      gap: 15px;
      margin: 0 auto;
    }

    header, .player-card, .track-row { 
      background: var(--card); 
      border-radius: 12px; 
      padding: 15px; 
      width: 100%; 
    }
    
    header { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .header-title-row { width: 100%; display: flex; justify-content: center; align-items: center; }
    
    h1 { font-size: 1.5rem; font-weight: 800; text-align: center; letter-spacing: 0.5px; }

    .header-controls-row { width: 100%; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; }
    
    select { background: #131b2e; color: #ffffff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; cursor: pointer; max-width: 100%; }
    select option { background-color: #131b2e; color: #ffffff; }
    
    .control-group { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-dim); flex-wrap: wrap; justify-content: center; }
    .btn-step { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text); width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .btn-step:hover { background: rgba(255,255,255,0.2); }
    .btn-reset { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-reset:hover { background: var(--primary); color: #000; }

    .player-card { display: flex; flex-direction: column; gap: 15px; }
    .controls-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .play-btn, .rewind-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .play-btn { background: var(--primary); color: #000; border: none; font-size: 1.3rem; }
    .play-btn:disabled, .rewind-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .rewind-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    
    .time-display { font-family: monospace; color: var(--primary); min-width: 100px; text-align: center; font-size: 0.9rem; }
    .timeline { flex: 1; min-width: 140px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; cursor: pointer; }
    .timeline-progress { height: 100%; background: var(--primary); border-radius: 4px; width: 0%; pointer-events: none; }
    .tracks-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    
    .track-row { display: flex; flex-direction: column; gap: 12px; padding: 15px; }
    .track-name { width: 100%; font-weight: 600; font-size: 0.95rem; word-break: break-word; }
    .track-controls { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
    
    input[type=range] { -webkit-appearance: none; flex: 1; min-width: 90px; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); cursor: pointer; }
    
    .vol-label { font-family: monospace; font-size: 0.85rem; color: var(--primary); min-width: 38px; text-align: right; }

    .btn-group { display: flex; gap: 6px; }
    .btn-track { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-track.active-pre { background: var(--primary); color: #000; }
    .btn-track.active-solo { background: #eccc68; color: #000; }
    .btn-track.active-mute { background: var(--accent); color: #fff; }
    
    .version-badge { font-size: 0.75rem; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 2px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; display: inline-block; font-weight: normal; }

    @media (min-width: 768px) {
      body { padding: 20px; }
      .track-row { flex-direction: row; align-items: center; justify-content: space-between; }
      .track-name { flex: 1 1 200px; width: auto; }
      .track-controls { flex: 2 1 400px; width: auto; flex-wrap: nowrap; }
    }
  </style>
</head>
<body>

<div id="sysContainer">
  <div class="sys-card">
    <h2>🎤 Raise You Up!</h2>
    <p style="font-size: 0.9rem; color: var(--text-dim);">Accès restreint. Veuillez entrer la clé d'initialisation :</p>
    <div class="input-wrapper">
      <input type="password" id="appConfigInput" placeholder="Clé d'accès" autofocus>
      <button type="button" class="toggle-view" onclick="toggleViewMode()" title="Afficher/Masquer">👁️</button>
    </div>
    <button class="btn-exec" onclick="initSession()">Charger</button>
    <div id="sysAlert">Clé invalide</div>
  </div>
</div>

<div id="appContent">
  <header>
    <div class="header-title-row">
      <h1>🎤 Raise You Up! <span class="version-badge">v59</span></h1>
    </div>

    <div class="header-controls-row">
      <select id="projectSelect" onchange="switchProject(this.value)">
        <option value="">-- Choisir un morceau --</option>
      </select>

      <div class="control-group">
        <span>Tonalité :</span>
        <button class="btn-step" onclick="stepPitch(-1)">-</button>
        <select id="pitchSelect" onchange="changePitch(this.value)">
          <option value="-12">-12 (-1 oct.)</option>
          <option value="-11">-11</option>
          <option value="-10">-10</option>
          <option value="-9">-9</option>
          <option value="-8">-8</option>
          <option value="-7">-7</option>
          <option value="-6">-6</option>
          <option value="-5">-5</option>
          <option value="-4">-4</option>
          <option value="-3">-3</option>
          <option value="-2">-2</option>
          <option value="-1">-1</option>
          <option value="0" selected>Original (0)</option>
          <option value="1">+1</option>
          <option value="2">+2</option>
          <option value="3">+3</option>
          <option value="4">+4</option>
          <option value="5">+5</option>
          <option value="6">+6</option>
          <option value="7">+7</option>
          <option value="8">+8</option>
          <option value="9">+9</option>
          <option value="10">+10</option>
          <option value="11">+11</option>
          <option value="12">+12 (+1 oct.)</option>
        </select>
        <button class="btn-step" onclick="stepPitch(1)">+</button>
        <button class="btn-reset" onclick="resetPitch()">RESET</button>
        <span id="currentKeyDisplay" style="font-weight: bold; color: var(--primary); min-width: 65px;"></span>
      </div>

      <div class="control-group">
        <span>Tempo :</span>
        <input type="range" id="tempoSlider" min="0.3" max="2.0" step="0.01" value="1.0" oninput="changeTempo(this.value)" style="width: 90px;">
        <span id="tempoLabel" style="min-width: 40px; font-weight: bold; color: var(--primary);">100%</span>
        <button class="btn-reset" onclick="resetTempo()">RESET</button>
      </div>
    </div>
  </header>

  <div class="player-card">
    <div id="status" style="font-size:0.85rem; color:var(--text-dim);">Chargement de la liste... (v59)</div>
    <div class="controls-row">
      <button class="rewind-btn" id="rewindBtn" title="Retour au début" disabled>⏮</button>
      <button class="play-btn" id="playBtn" disabled>▶</button>
      <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
      <div class="timeline" id="timeline">
        <div class="timeline-progress" id="progress"></div>
      </div>
    </div>
  </div>
  <div class="tracks-list" id="tracksList"></div>
</div>

<script>
  // Paramètre interne de validation (RaiseYouUp!2026)
  const systemConfig = "RaiseYouUp!2026";

  function toggleViewMode() {
    const field = document.getElementById("appConfigInput");
    field.type = field.type === "password" ? "text" : "password";
  }

  function initSession() {
    const val = document.getElementById("appConfigInput").value.trim();
    if (val === systemConfig) {
      document.getElementById("sysContainer").style.display = "none";
      document.getElementById("appContent").style.display = "flex";
      loadPlaylist();
    } else {
      document.getElementById("sysAlert").style.display = "block";
    }
  }

  document.getElementById("appConfigInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") initSession();
  });

  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
      e.preventDefault();
      return false;
    }
  });

  function decodeBase64(str) {
    if (!str) return '';
    try {
      return decodeURIComponent(escape(window.atob(str)));
    } catch (e) {
      return str;
    }
  }

  let availableProjects = [];
  let currentProjectOriginalKey = "";
  const select = document.getElementById("projectSelect");
  const playBtn = document.getElementById("playBtn");
  const rewindBtn = document.getElementById("rewindBtn");
  const status = document.getElementById("status");

  const chromaticNotes = [
    'C', 'Db / C#', 'D', 'Eb / D#', 'E', 'F', 'Gb / F#', 'G', 'Ab / G#', 'A', 'Bb / A#', 'B'
  ];

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')) {
        return;
      }
      e.preventDefault();
      if (!playBtn.disabled) {
        togglePlay();
      }
    }
  });

  async function loadPlaylist() {
    try {
      const res = await fetch('./playlist.json?v=' + new Date().getTime());
      if (!res.ok) throw new Error("Fichier playlist.json non trouvé");
      const data = await res.json();
      availableProjects = Array.isArray(data) ? data : (data.projects || [data]);
      
      select.innerHTML = '<option value="">-- Choisir un morceau --</option>';
      if (availableProjects.length > 0) {
        availableProjects.forEach((p, idx) => {
          let opt = document.createElement("option");
          opt.value = idx;
          let decodedTitle = decodeBase64(p.title || p.name || p.folder || `Morceau ${idx + 1}`);
          opt.innerText = decodedTitle;
          select.appendChild(opt);
        });
        status.innerText = "Sélectionnez un morceau dans le menu ci-dessus";
      } else {
        status.innerText = "Aucun morceau trouvé dans la playlist.";
      }
    } catch(err) {
      console.error(err);
      status.innerText = "Erreur de chargement du fichier playlist.json";
    }
  }

  let tracks = [], isPlaying = false, pauseOffset = 0, duration = 0;
  let playStartRealTime = 0;
  let currentPitchSemitones = 0;
  let currentTempoRatio = 1.0;

  function updateDynamicKeyDisplay() {
    const keyDisplay = document.getElementById("currentKeyDisplay");
    if (!currentProjectOriginalKey) {
      keyDisplay.innerText = "";
      return;
    }
    
    let base = currentProjectOriginalKey.trim();
    let isMinor = base.toLowerCase().includes('m') && !base.toLowerCase().includes('maj');
    let rootNote = base.replace(/m.*$/, "").toUpperCase();
    
    let idx = chromaticNotes.findIndex(item => {
      let parts = item.split(' / ');
      return parts.some(p => p.toUpperCase() === rootNote);
    });

    if (idx === -1) {
      keyDisplay.innerText = `(${currentProjectOriginalKey})`;
      return;
    }

    let newIdx = (idx + currentPitchSemitones) % 12;
    if (newIdx < 0) newIdx += 12;
    
    let transposedNoteStr = chromaticNotes[newIdx];
    let finalKey = transposedNoteStr + (isMinor ? 'm' : '');
    keyDisplay.innerText = `(${finalKey})`;
  }

  function changePitch(semitones) {
    currentPitchSemitones = parseInt(semitones, 10);
    document.getElementById("pitchSelect").value = currentPitchSemitones;
    tracks.forEach(t => {
      if (t.player) {
        t.player.detune = currentPitchSemitones * 100;
      }
    });
    updateDynamicKeyDisplay();
  }

  function stepPitch(delta) {
    let newVal = currentPitchSemitones + delta;
    if (newVal < -12) newVal = -12;
    if (newVal > 12) newVal = 12;
    changePitch(newVal);
  }

  function resetPitch() { changePitch(0); }

  function changeTempo(val) {
    currentTempoRatio = parseFloat(val);
    document.getElementById("tempoSlider").value = currentTempoRatio;
    document.getElementById("tempoLabel").innerText = `${Math.round(currentTempoRatio * 100)}%`;
    tracks.forEach(t => {
      if (t.player) {
        t.player.playbackRate = currentTempoRatio;
      }
    });
  }

  function resetTempo() { changeTempo(1.0); }

  function fetchAudioBuffer(url) {
    return new Promise((resolve, reject) => {
      const buffer = new Tone.ToneAudioBuffer(url, () => resolve(buffer), (err) => reject(err));
    });
  }

  async function switchProject(idx) {
    if (idx === "") {
      stopAllSources();
      isPlaying = false;
      pauseOffset = 0;
      duration = 0;
      tracks = [];
      currentProjectOriginalKey = "";
      
      playBtn.innerText = "▶";
      playBtn.disabled = true;
      rewindBtn.disabled = true;
      document.getElementById("timeDisplay").innerText = "00:00 / 00:00";
      document.getElementById("progress").style.width = "0%";
      document.getElementById("tracksList").innerHTML = "";
      
      resetPitch();
      updateDynamicKeyDisplay();
      resetTempo();
      
      status.innerText = "Sélectionnez un morceau dans le menu ci-dessus";
      return;
    }

    stopAllSources();
    isPlaying = false;
    pauseOffset = 0;
    playStartRealTime = 0;
    playBtn.innerText = "▶";
    playBtn.disabled = true;
    rewindBtn.disabled = true;
    document.getElementById("timeDisplay").innerText = "00:00 / 00:00";
    document.getElementById("progress").style.width = "0%";
    
    const proj = availableProjects[idx];
    
    let rawFolder = proj.folder || proj.path || '';
    let folderName = decodeBase64(rawFolder);

    let detectedKey = proj.key || proj.originalKey || "";
    if (!detectedKey) {
      let textSource = folderName || proj.title || "";
      let match = textSource.match(/__(?:Key-)?([A-G][b\#]?m?)/i) || textSource.match(/\[([A-G][b\#]?m?)\]/i);
      if (match) {
        detectedKey = match[1];
      }
    }
    currentProjectOriginalKey = detectedKey;

    resetPitch();
    updateDynamicKeyDisplay();

    status.innerText = "Chargement des pistes en cours...";

    if (typeof Tone !== 'undefined') {
      await Tone.start();
    }

    tracks = [];
    const listContainer = document.getElementById("tracksList");
    listContainer.innerHTML = "";

    duration = 0;
    
    const trackListObj = proj.tracks || proj.files || proj.items || [];
    let trackFiles = Array.isArray(trackListObj) ? trackListObj : Object.values(trackListObj);

    if (trackFiles.length === 0) {
      status.innerText = "Erreur : aucune piste trouvée dans ce projet.";
      return;
    }

    let loaded = 0;
    for (let i = 0; i < trackFiles.length; i++) {
      let rawFile = trackFiles[i];
      if (typeof rawFile === 'object' && rawFile !== null) {
        rawFile = rawFile.name || rawFile.file || rawFile.filename || '';
      }
      
      let filePath = decodeBase64(String(rawFile).trim());
      const fileNameOnly = filePath.split('/').pop();
      const trackName = fileNameOnly.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
      
      let urlWithFolder = folderName ? `${folderName}/${filePath}` : filePath;
      urlWithFolder = urlWithFolder.split('/').map(part => encodeURIComponent(part)).join('/');
      let urlDirect = encodeURIComponent(fileNameOnly);

      let loadedBuffer = null;

      try {
        loadedBuffer = await fetchAudioBuffer(urlWithFolder);
      } catch (e1) {
        try {
          loadedBuffer = await fetchAudioBuffer(urlDirect);
        } catch (e2) {
          console.error("Impossible de charger la piste :", fileNameOnly);
        }
      }

      if (loadedBuffer) {
        let player = new Tone.GrainPlayer({
          url: loadedBuffer,
          grainSize: 0.2,
          overlap: 0.1
        });

        player.playbackRate = currentTempoRatio;
        player.detune = currentPitchSemitones * 100;

        const volumeNode = new Tone.Volume(0).toDestination();
        player.connect(volumeNode);

        if (loadedBuffer.duration > duration) duration = loadedBuffer.duration;
        loaded++;
        status.innerText = `Chargement (${loaded}/${trackFiles.length})...`;

        tracks.push({
          name: trackName,
          player: player,
          volumeNode: volumeNode,
          baseVol: 1,
          pre: false,
          solo: false,
          mute: false
        });
      }
    }

    if (tracks.length === 0) {
      status.innerText = "Erreur de chargement des pistes audio.";
      return;
    }

    tracks.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "track-row";
      row.innerHTML = `
        <div class="track-name">${t.name}</div>
        <div class="track-controls">
          <input type="range" id="vol-range-${i}" min="0" max="1" step="0.01" value="1" oninput="setVolume(${i}, this.value)">
          <button class="btn-reset" onclick="resetVolume(${i})">RESET</button>
          <span class="vol-label" id="vol-label-${i}">100%</span>
          <div class="btn-group">
            <button class="btn-track" id="pre-${i}" onclick="togglePRE(${i})" title="FOCUS">FOCUS</button>
            <button class="btn-track" id="solo-${i}" onclick="toggleSolo(${i})" title="Solo">S</button>
            <button class="btn-track" id="mute-${i}" onclick="toggleMute(${i})" title="Mute">M</button>
          </div>
        </div>
      `;
      listContainer.appendChild(row);
    });

    status.innerText = "Prêt à la lecture";
    playBtn.disabled = false;
    rewindBtn.disabled = false;
  }

  function playAll(offset = 0) {
    stopAllSources();
    playStartRealTime = Tone.now();
    pauseOffset = offset;
    
    tracks.forEach(t => {
      if (t.player && t.player.loaded) {
        t.player.start(playStartRealTime, offset);
      }
    });
    updateMix();
    isPlaying = true;
    playBtn.innerText = "⏸";
    status.innerText = "Lecture en cours...";
  }

  function stopAllSources() {
    tracks.forEach(t => {
      if (t.player) {
        try { t.player.stop(); } catch(e){}
      }
    });
  }

  async function togglePlay() {
    if (typeof Tone !== 'undefined') await Tone.start();

    if (isPlaying) {
      const elapsed = (Tone.now() - playStartRealTime) * currentTempoRatio;
      pauseOffset = Math.min(duration, pauseOffset + elapsed);
      stopAllSources();
      isPlaying = false;
      playBtn.innerText = "▶";
      status.innerText = "En pause";
    } else {
      if (pauseOffset >= duration) pauseOffset = 0;
      playAll(pauseOffset);
    }
  }

  playBtn.onclick = togglePlay;

  rewindBtn.onclick = () => {
    stopAllSources();
    isPlaying = false;
    pauseOffset = 0;
    playBtn.innerText = "▶";
    status.innerText = "Retour au début";
    document.getElementById("progress").style.width = "0%";
    document.getElementById("timeDisplay").innerText = `00:00 / ${formatTime(duration)}`;
  };

  const timeline = document.getElementById("timeline");
  let isDragging = false;

  function getTimeFromEvent(e) {
    const rect = timeline.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return pos * duration;
  }

  timeline.onmousedown = (e) => {
    if (duration <= 0) return;
    isDragging = true;
    const targetTime = getTimeFromEvent(e);
    updateTimelineUI(targetTime);
  };

  window.onmousemove = (e) => {
    if (!isDragging || duration <= 0) return;
    const targetTime = getTimeFromEvent(e);
    updateTimelineUI(targetTime);
  };

  window.onmouseup = (e) => {
    if (!isDragging) return;
    isDragging = false;
    const targetTime = getTimeFromEvent(e);
    pauseOffset = targetTime;
    if (isPlaying) {
      playAll(targetTime);
    }
  };

  function updateTimelineUI(cur) {
    document.getElementById("progress").style.width = `${(cur / duration) * 100}%`;
    document.getElementById("timeDisplay").innerText = `${formatTime(cur)} / ${formatTime(duration)}`;
  }

  setInterval(() => {
    if (isPlaying && duration > 0 && !isDragging) {
      const elapsed = (Tone.now() - playStartRealTime) * currentTempoRatio;
      const cur = Math.min(duration, pauseOffset + elapsed);
      updateTimelineUI(cur);
      if (cur >= duration) { stopAllSources(); isPlaying = false; pauseOffset = 0; playBtn.innerText = "▶"; status.innerText = "Terminé"; }
    }
  }, 100);

  function setVolume(i, v) { 
    tracks[i].baseVol = parseFloat(v); 
    const pct = Math.round(v * 100);
    const label = document.getElementById(`vol-label-${i}`);
    if (label) label.innerText = `${pct}%`;
    updateMix(); 
  }

  function resetVolume(i) {
    tracks[i].baseVol = 1.0;
    const slider = document.getElementById(`vol-range-${i}`);
    if (slider) slider.value = 1.0;
    const label = document.getElementById(`vol-label-${i}`);
    if (label) label.innerText = `100%`;
    updateMix();
  }

  function togglePRE(i) { tracks[i].pre = !tracks[i].pre; document.getElementById(`pre-${i}`).classList.toggle("active-pre", tracks[i].pre); updateMix(); }
  function toggleSolo(i) { tracks[i].solo = !tracks[i].solo; document.getElementById(`solo-${i}`).classList.toggle("active-solo", tracks[i].solo); updateMix(); }
  function toggleMute(i) { tracks[i].mute = !tracks[i].mute; document.getElementById(`mute-${i}`).classList.toggle("active-mute", tracks[i].mute); updateMix(); }

  function updateMix() {
    const hasSolo = tracks.some(t => t.solo);
    const hasPre = tracks.some(t => t.pre);
    tracks.forEach(t => {
      let v = t.baseVol;
      if (t.mute) v = 0;
      else if (hasSolo) v = t.solo ? t.baseVol : 0;
      else if (hasPre) v = t.pre ? t.baseVol : t.baseVol * 0.2;
      
      const db = v === 0 ? -Infinity : 20 * Math.log10(v);
      if (t.volumeNode) t.volumeNode.volume.value = db;
    });
  }

  function formatTime(s) {
    const mins = Math.floor(s / 60), secs = Math.floor(s % 60);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }
</script>
</body>
</html>
