<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur Multipiste - Raise You Up! (v30)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root { --bg: #0b0f19; --card: #131b2e; --primary: #00d2ff; --text: #f0f4f8; --text-dim: #8a99ad; --accent: #ff4757; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 20px; }
    header, .player-card, .track-row { background: var(--card); border-radius: 12px; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    h1 { font-size: 1.2rem; }
    select { background: #131b2e; color: #ffffff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; font-size: 1rem; outline: none; cursor: pointer; }
    select option { background-color: #131b2e; color: #ffffff; }
    
    .control-group { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-dim); }
    .btn-step { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text); width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .btn-step:hover { background: rgba(255,255,255,0.2); }
    .btn-reset { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-reset:hover { background: var(--primary); color: #000; }

    .player-card { display: flex; flex-direction: column; gap: 15px; }
    .controls-row { display: flex; align-items: center; gap: 15px; }
    .play-btn, .rewind-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .play-btn { background: var(--primary); color: #000; border: none; font-size: 1.3rem; }
    .play-btn:disabled, .rewind-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .rewind-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    
    .time-display { font-family: monospace; color: var(--primary); min-width: 110px; text-align: center; }
    .timeline { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; cursor: pointer; }
    .timeline-progress { height: 100%; background: var(--primary); border-radius: 4px; width: 0%; pointer-events: none; }
    .tracks-list { display: flex; flex-direction: column; gap: 10px; }
    
    .track-row { display: flex; align-items: center; gap: 15px; padding: 14px 20px; flex-wrap: wrap; }
    .track-name { flex: 1 1 250px; font-weight: 600; font-size: 0.95rem; word-break: break-word; }
    .track-controls { display: flex; align-items: center; gap: 15px; flex: 2 1 300px; }
    
    input[type=range] { -webkit-appearance: none; flex: 1; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; }
    .btn-group { display: flex; gap: 5px; }
    .btn-track { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-track.active-pre { background: var(--primary); color: #000; }
    .btn-track.active-solo { background: #eccc68; color: #000; }
    .btn-track.active-mute { background: var(--accent); color: #fff; }
    
    .version-badge { font-size: 0.75rem; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 2px 8px; border-radius: 4px; margin-left: 10px; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎛️ Morceaux Raise You Up! <span class="version-badge">v30</span></h1>
    <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
      
      <!-- Tonalité -->
      <div class="control-group">
        <span>Tonalité :</span>
        <button class="btn-step" onclick="stepPitch(-1)">-</button>
        <select id="pitchSelect" onchange="changePitch(this.value)">
          <option value="-12">-12 (-1 oct.)</option>
          <option value="-11">-11</option>
          <option value="-10">-10</option>
          <option value="-9">-9</option>
          <option value="-8">-8</option>
          <option value="-7">-7</option>
          <option value="-6">-6</option>
          <option value="-5">-5</option>
          <option value="-4">-4</option>
          <option value="-3">-3</option>
          <option value="-2">-2</option>
          <option value="-1">-1</option>
          <option value="0" selected>Original (0)</option>
          <option value="1">+1</option>
          <option value="2">+2</option>
          <option value="3">+3</option>
          <option value="4">+4</option>
          <option value="5">+5</option>
          <option value="6">+6</option>
          <option value="7">+7</option>
          <option value="8">+8</option>
          <option value="9">+9</option>
          <option value="10">+10</option>
          <option value="11">+11</option>
          <option value="12">+12 (+1 oct.)</option>
        </select>
        <button class="btn-step" onclick="stepPitch(1)">+</button>
        <button class="btn-reset" onclick="resetPitch()">RESET</button>
      </div>

      <!-- Tempo -->
      <div class="control-group">
        <span>Tempo :</span>
        <input type="range" id="tempoSlider" min="0.3" max="3.0" step="0.05" value="1.0" oninput="changeTempo(this.value)" style="width: 80px;">
        <span id="tempoLabel" style="min-width: 42px; font-weight: bold; color: var(--primary);">100%</span>
        <button class="btn-reset" onclick="resetTempo()">RESET</button>
      </div>

      <select id="projectSelect" onchange="switchProject(this.value)">
        <option value="">-- Choisir un morceau --</option>
      </select>

    </div>
  </header>
  <div class="player-card">
    <div id="status" style="font-size:0.85rem; color:var(--text-dim);">Chargement de la liste... (v30)</div>
    <div class="controls-row">
      <button class="rewind-btn" id="rewindBtn" title="Retour au début" disabled>⏮</button>
      <button class="play-btn" id="playBtn" disabled>▶</button>
      <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
      <div class="timeline" id="timeline">
        <div class="timeline-progress" id="progress"></div>
      </div>
    </div>
  </div>
  <div class="tracks-list" id="tracksList"></div>
</div>

<script>
  let availableProjects = [];
  const select = document.getElementById("projectSelect");
  const playBtn = document.getElementById("playBtn");
  const rewindBtn = document.getElementById("rewindBtn");
  const status = document.getElementById("status");

  window.addEventListener('DOMContentLoaded', () => {
    loadPlaylist();
  });

  async function loadPlaylist() {
    try {
      const res = await fetch('./playlist.json?v=' + new Date().getTime());
      if (!res.ok) throw new Error("Fichier playlist.json non trouvé");
      const data = await res.json();
      availableProjects = Array.isArray(data) ? data : (data.projects || [data]);
      
      select.innerHTML = '<option value="">-- Choisir un morceau --</option>';
      if (availableProjects.length > 0) {
        availableProjects.forEach((p, idx) => {
          let opt = document.createElement("option");
          opt.value = idx;
          opt.innerText = p.title || p.name || p.folder || `Morceau ${idx + 1}`;
          select.appendChild(opt);
        });
        status.innerText = "Sélectionnez un morceau dans le menu ci-dessus";
      } else {
        status.innerText = "Aucun morceau trouvé dans la playlist.";
      }
    } catch(err) {
      console.error(err);
      status.innerText = "Erreur de chargement du fichier playlist.json";
    }
  }

  let tracks = [], isPlaying = false, pauseOffset = 0, duration = 0;
  let playStartRealTime = 0;
  let currentPitchSemitones = 0;
  let currentTempoRatio = 1.0;

  function changePitch(semitones) {
    currentPitchSemitones = parseInt(semitones, 10);
    document.getElementById("pitchSelect").value = currentPitchSemitones;
    tracks.forEach(t => {
      if (t.player) {
        t.player.detune = currentPitchSemitones * 100;
      }
    });
  }

  function stepPitch(delta) {
    let newVal = currentPitchSemitones + delta;
    if (newVal < -12) newVal = -12;
    if (newVal > 12) newVal = 12;
    changePitch(newVal);
  }

  function resetPitch() { changePitch(0); }

  function changeTempo(val) {
    currentTempoRatio = parseFloat(val);
    document.getElementById("tempoSlider").value = currentTempoRatio;
    document.getElementById("tempoLabel").innerText = `${Math.round(currentTempoRatio * 100)}%`;
    tracks.forEach(t => {
      if (t.player) {
        t.player.playbackRate = currentTempoRatio;
      }
    });
  }

  function resetTempo() { changeTempo(1.0); }

  function fetchAudioBuffer(url) {
    return new Promise((resolve, reject) => {
      const buffer = new Tone.ToneAudioBuffer(url, () => resolve(buffer), (err) => reject(err));
    });
  }

  async function switchProject(idx) {
    if (idx === "") return;
    stopAllSources();
    isPlaying = false;
    pauseOffset = 0;
    playStartRealTime = 0;
    playBtn.innerText = "▶";
    playBtn.disabled = true;
    rewindBtn.disabled = true;
    document.getElementById("timeDisplay").innerText = "00:00 / 00:00";
    document.getElementById("progress").style.width = "0%";
    
    const proj = availableProjects[idx];
    status.innerText = "Chargement des pistes en cours...";

    if (typeof Tone !== 'undefined') {
      await Tone.start();
    }

    tracks = [];
    const listContainer = document.getElementById("tracksList");
    listContainer.innerHTML = "";

    duration = 0;
    
    const folderName = proj.folder || proj.path || '';
    const trackListObj = proj.tracks || proj.files || proj.items || [];
    let trackFiles = Array.isArray(trackListObj) ? trackListObj : Object.values(trackListObj);

    if (trackFiles.length === 0) {
      status.innerText = "Erreur : aucune piste trouvée dans ce projet.";
      return;
    }

    let loaded = 0;
    for (let i = 0; i < trackFiles.length; i++) {
      let rawFile = trackFiles[i];
      if (typeof rawFile === 'object' && rawFile !== null) {
        rawFile = rawFile.name || rawFile.file || rawFile.filename || '';
      }
      
      let filePath = String(rawFile).trim();
      const fileNameOnly = filePath.split('/').pop();
      const trackName = fileNameOnly.replace(/\.[^/.]+$/, "");
      
      let urlWithFolder = folderName ? `${folderName}/${filePath}` : filePath;
      urlWithFolder = urlWithFolder.split('/').map(part => encodeURIComponent(part)).join('/');
      let urlDirect = encodeURIComponent(fileNameOnly);

      let loadedBuffer = null;

      try {
        loadedBuffer = await fetchAudioBuffer(urlWithFolder);
      } catch (e1) {
        try {
          loadedBuffer = await fetchAudioBuffer(urlDirect);
        } catch (e2) {
          console.error("Impossible de charger la piste :", fileNameOnly);
        }
      }

      if (loadedBuffer) {
        let player = new Tone.GrainPlayer({
          url: loadedBuffer,
          grainSize: 0.2,
          overlap: 0.1
        });

        player.playbackRate = currentTempoRatio;
        player.detune = currentPitchSemitones * 100;

        const volumeNode = new Tone.Volume(0).toDestination();
        player.connect(volumeNode);

        if (loadedBuffer.duration > duration) duration = loadedBuffer.duration;
        loaded++;
        status.innerText = `Chargement (${loaded}/${trackFiles.length})...`;

        tracks.push({
          name: trackName,
          player: player,
          volumeNode: volumeNode,
          baseVol: 1,
          pre: false,
          solo: false,
          mute: false
        });
      }
    }

    if (tracks.length === 0) {
      status.innerText = "Erreur de chargement des pistes audio (vérifiez la console).";
      return;
    }

    tracks.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "track-row";
      row.innerHTML = `
        <div class="track-name">${t.name}</div>
        <div class="track-controls">
          <input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(${i}, this.value)">
          <div class="btn-group">
            <button class="btn-track" id="pre-${i}" onclick="togglePRE(${i})">PRE</button>
            <button class="btn-track" id="solo-${i}" onclick="toggleSolo(${i})">S</button>
            <button class="btn-track" id="mute-${i}" onclick="toggleMute(${i})">M</button>
          </div>
        </div>
      `;
      listContainer.appendChild(row);
    });

    status.innerText = "Prêt à la lecture";
    playBtn.disabled = false;
    rewindBtn.disabled = false;
  }

  function playAll(offset = 0) {
    stopAllSources();
    playStartRealTime = Tone.now();
    pauseOffset = offset;
    
    tracks.forEach(t => {
      if (t.player && t.player.loaded) {
        t.player.start(playStartRealTime, offset);
      }
    });
    updateMix();
    isPlaying = true;
    playBtn.innerText = "⏸";
    status.innerText = "Lecture en cours...";
  }

  function stopAllSources() {
    tracks.forEach(t => {
      if (t.player) {
        try { t.player.stop(); } catch(e){}
      }
    });
  }

  playBtn.onclick = async () => {
    if (typeof Tone !== 'undefined') await Tone.start();

    if (isPlaying) {
      const elapsed = (Tone.now() - playStartRealTime) * currentTempoRatio;
      pauseOffset = Math.min(duration, pauseOffset + elapsed);
      stopAllSources();
      isPlaying = false;
      playBtn.innerText = "▶";
      status.innerText = "En pause";
    } else {
      if (pauseOffset >= duration) pauseOffset = 0;
      playAll(pauseOffset);
    }
  };

  rewindBtn.onclick = () => {
    stopAllSources();
    isPlaying = false;
    pauseOffset = 0;
    playBtn.innerText = "▶";
    status.innerText = "Retour au début";
    document.getElementById("progress").style.width = "0%";
    document.getElementById("timeDisplay").innerText = `00:00 / ${formatTime(duration)}`;
  };

  const timeline = document.getElementById("timeline");
  let isDragging = false;

  function getTimeFromEvent(e) {
    const rect = timeline.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return pos * duration;
  }

  timeline.onmousedown = (e) => {
    if (duration <= 0) return;
    isDragging = true;
    const targetTime = getTimeFromEvent(e);
    updateTimelineUI(targetTime);
  };

  window.onmousemove = (e) => {
    if (!isDragging || duration <= 0) return;
    const targetTime = getTimeFromEvent(e);
    updateTimelineUI(targetTime);
  };

  window.onmouseup = (e) => {
    if (!isDragging) return;
    isDragging = false;
    const targetTime = getTimeFromEvent(e);
    pauseOffset = targetTime;
    if (isPlaying) {
      playAll(targetTime);
    }
  };

  function updateTimelineUI(cur) {
    document.getElementById("progress").style.width = `${(cur / duration) * 100}%`;
    document.getElementById("timeDisplay").innerText = `${formatTime(cur)} / ${formatTime(duration)}`;
  }

  setInterval(() => {
    if (isPlaying && duration > 0 && !isDragging) {
      const elapsed = (Tone.now() - playStartRealTime) * currentTempoRatio;
      const cur = Math.min(duration, pauseOffset + elapsed);
      updateTimelineUI(cur);
      if (cur >= duration) { stopAllSources(); isPlaying = false; pauseOffset = 0; playBtn.innerText = "▶"; status.innerText = "Terminé"; }
    }
  }, 100);

  function setVolume(i, v) { tracks[i].baseVol = parseFloat(v); updateMix(); }
  function togglePRE(i) { tracks[i].pre = !tracks[i].pre; document.getElementById(`pre-${i}`).classList.toggle("active-pre", tracks[i].pre); updateMix(); }
  function toggleSolo(i) { tracks[i].solo = !tracks[i].solo; document.getElementById(`solo-${i}`).classList.toggle("active-solo", tracks[i].solo); updateMix(); }
  function toggleMute(i) { tracks[i].mute = !tracks[i].mute; document.getElementById(`mute-${i}`).classList.toggle("active-mute", tracks[i].mute); updateMix(); }

  function updateMix() {
    const hasSolo = tracks.some(t => t.solo);
    const hasPre = tracks.some(t => t.pre);
    tracks.forEach(t => {
      let v = t.baseVol;
      if (t.mute) v = 0;
      else if (hasSolo) v = t.solo ? t.baseVol : 0;
      else if (hasPre) v = t.pre ? t.baseVol : t.baseVol * 0.2;
      
      const db = v === 0 ? -Infinity : 20 * Math.log10(v);
      if (t.volumeNode) t.volumeNode.volume.value = db;
    });
  }

  function formatTime(s) {
    const mins = Math.floor(s / 60), secs = Math.floor(s % 60);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }
</script>
</body>
</html>
