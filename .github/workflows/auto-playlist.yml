name: Generate Playlist
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate playlist.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            
            const isDir = d => fs.statSync(d).isDirectory() && !d.startsWith(".") && d !== "node_modules";
            const folders = fs.readdirSync(".").filter(isDir);
            
            const playlist = folders.map(folder => {
              const files = fs.readdirSync(folder).filter(f => f.toLowerCase().endsWith(".mp3") || f.toLowerCase().endsWith(".wav"));
              return {
                title: folder.replace(/_/g, " "),
                folder: folder,
                tracks: files
              };
            }).filter(p => p.tracks.length > 0);
            
            fs.writeFileSync("playlist.json", JSON.stringify(playlist, null, 2));
          '

      - name: Commit and Push playlist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Auto-update playlist.json" || exit 0
          git push
