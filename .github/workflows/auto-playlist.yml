name: Générer la playlist automatique (Sécurisée Base64)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Générer le playlist.json avec obfuscation Base64
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function toBase64(str) {
            return Buffer.from(str, "utf8").toString("base64");
          }

          const parentDir = "morceaux";
          const audioExtensions = [".mp3", ".wav", ".m4a", ".aac", ".ogg"];

          if (!fs.existsSync(parentDir)) {
            console.error("Le dossier parent " + parentDir + " n existe pas !");
            process.exit(1);
          }

          let entries = fs.readdirSync(parentDir, { withFileTypes: true });
          let projects = [];

          entries.forEach(entry => {
            if (entry.isDirectory()) {
              let folderName = entry.name;
              let folderPath = path.join(parentDir, folderName);
              
              let files = fs.readdirSync(folderPath).filter(file => {
                return audioExtensions.includes(path.extname(file).toLowerCase());
              }).sort();

              if (files.length > 0) {
                projects.push({
                  folder: toBase64(folderPath),
                  tracks: files.map(f => toBase64(f))
                });
              }
            }
          });

          fs.writeFileSync("playlist.json", JSON.stringify(projects, null, 2));
          console.log("playlist.json généré et encodé en Base64 avec succès depuis " + parentDir + " !");
          '

      - name: Publier les modifications sur le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique de la playlist (Base64)" && git push)
