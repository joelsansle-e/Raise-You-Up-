name: Generate Playlist
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate playlist.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            
            try {
              const isDir = d => {
                try {
                  return fs.statSync(d).isDirectory() && !d.startsWith(".") && d !== "node_modules";
                } catch (e) {
                  return false;
                }
              };
              
              const folders = fs.readdirSync(".").filter(isDir);
              
              const playlist = folders.map(folder => {
                const files = fs.readdirSync(folder).filter(f => f.toLowerCase().endsWith(".mp3") || f.toLowerCase().endsWith(".wav"));
                
                // Nettoie le titre pour enlever les crochets (ex: "Everything_Hallelujah_[Eb]" -> "Everything Hallelujah")
                let cleanTitle = folder.replace(/\[.*?\]/g, "").replace(/_/g, " ").trim();
                
                // Extrait la tonalité automatiquement
                let match = folder.match(/\[([A-G][b\#]?m?)\]/i);
                let key = match ? match[1] : null;

                return {
                  title: cleanTitle || folder.replace(/_/g, " "),
                  folder: folder,
                  key: key,
                  tracks: files
                };
              }).filter(p => p.tracks.length > 0);
              
              fs.writeFileSync("playlist.json", JSON.stringify(playlist, null, 2));
              console.log("playlist.json généré avec succès !");
            } catch (err) {
              console.error("Erreur lors de la génération du JSON:", err);
              process.exit(1);
            }
          '

      - name: Commit and Push playlist.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Auto-update playlist.json" || exit 0
          git push
